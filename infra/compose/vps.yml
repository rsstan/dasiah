# Overrides for a single VPS (infra/terraform/vps): only the web container is reachable from
# outside (80, and 443 when a domain is set); the databases, broker, Redis, Jaeger and the gateway
# stay on the internal Compose network.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  rabbitmq:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  jaeger:
    ports: !reset []
    # Traces are kept in memory; at the limit it restarts empty instead of taking the server's memory.
    mem_limit: 1g
    restart: unless-stopped
  # Own car routing (osrm_cities): reachable inside only. Published ports would bypass the firewall,
  # because Docker writes its own rules in front of ufw.
  osrm-waw:
    ports: !reset []
    restart: unless-stopped
  osrm-vno:
    ports: !reset []
    restart: unless-stopped
  osrm-stub:
    restart: unless-stopped
  geocoder-stub:
    restart: unless-stopped
  gateway:
    ports: !reset []
  web:
    environment:
      # A domain (example.org) makes Caddy obtain a TLS certificate; empty serves plain HTTP on :80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: !override
      - '80:80'
      - '443:443'
    volumes:
      - caddydata:/data
      - caddyconfig:/config

volumes:
  caddydata:
  caddyconfig:
