name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A push runs only this job; everything else runs on pull requests (and on demand).
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    name: typecheck, unit tests, web build
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm web:build

  integration:
    name: unit and integration tests with coverage (Testcontainers)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fails below the coverage thresholds of vitest.config.ts.
      - run: pnpm test:cov
      - name: Coverage table on the summary page
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            { echo '## Coverage'; echo; node scripts/coverage-summary.ts; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-and-test-results
          path: |
            coverage
            reports/junit.xml
          retention-days: 90

  mutation:
    name: mutation tests (Stryker)
    # Minutes long: only on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fails below the mutation score of stryker.config.json.
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 90

  contracts:
    name: contracts (lint, generated code up to date)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:gen
      - run: pnpm contracts:lint
      - name: Generated files match the contracts
        run: |
          git status --porcelain -- contracts packages/contracts
          test -z "$(git status --porcelain -- contracts packages/contracts)"

  database:
    name: database (bootstrap, up/down/up, seeds, smoke, dictionary)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_DB: heatmap
          POSTGRES_USER: postgres
          # Throw-away CI database, never reachable from outside the job.
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heatmap"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      POSTGRES_DB: heatmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-superuser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate role passwords for this run
        run: |
          for v in APP_ADMIN SVC_IDENTITY SVC_TRANSIT SVC_ACCESSIBILITY SVC_PLACES REPORTING; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            echo "DB_PASSWORD_$v=$pw" >> "$GITHUB_ENV"
          done
      - run: pnpm db:bootstrap
      - name: Migrate up, down, up
        run: |
          pnpm db:migrate up
          pnpm db:migrate down --all
          pnpm db:migrate up
      - run: pnpm db:seed
      - run: pnpm db:smoke | tee smoke.log && grep -q 'SMOKE TEST PASSED' smoke.log
      - name: Data dictionary is up to date
        run: |
          pnpm db:dict
          git diff --exit-code docs/db/data-dictionary.md

  e2e:
    name: end-to-end (Compose profile full, Playwright)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Builds the images and starts the stack with secrets generated for this run (.e2e/.env).
      - run: pnpm e2e:up
      - name: Mask the generated secrets
        run: grep -E '^(POSTGRES_PASSWORD|DB_PASSWORD_|RABBITMQ_PASSWORD|SEED_DEMO_PASSWORD)' .e2e/.env | cut -d= -f2- | sed 's/^/::add-mask::/'
      # Uses the Chrome preinstalled on the runner (channel chrome), no browser download.
      - run: pnpm e2e
      - name: Load test scripts (short run) and rate limits
        run: |
          pnpm load capacity smoke
          pnpm load rate-limit
      - name: Container logs
        if: failure()
        run: scripts/e2e.sh logs > e2e-containers.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            e2e-containers.log
          retention-days: 7
      - if: always()
        run: pnpm e2e:down
