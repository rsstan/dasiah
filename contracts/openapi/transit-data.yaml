openapi: 3.1.0
info:
  title: transit-data service
  version: 1.0.0
  description: |
    Timetable lifecycle: GTFS import (raw -> staging -> core), H3 grid and access stops,
    activation of a feed version, and the timetable artifacts consumed by `accessibility`.
    Owns schemas `transit` and `transit_staging`.

    `x-access`: access level at the gateway (`internal` = not routed). `x-rate-limit`: per-minute
    limit at the gateway.
servers:
  - url: http://transit-data:3002
tags:
  - name: cities
  - name: admin
  - name: internal
  - name: health
paths:
  /cities:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listCities
      summary: Supported cities with bounds and the validity of the active timetable
      tags: [cities]
      x-access: public
      x-rate-limit: { perMinute: 120 }
      responses:
        '200':
          description: Enabled cities, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                additionalProperties: false
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /cities/{code}/coverage:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/CityCodePath'
    get:
      operationId: getCityCoverage
      summary: Grid and network size of the active feed (transit.mv_city_coverage)
      tags: [cities]
      x-access: public
      x-rate-limit: { perMinute: 60 }
      responses:
        '200':
          description: Coverage numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityCoverage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /admin/feed-versions:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: './common.yaml#/components/parameters/UserId'
      - $ref: './common.yaml#/components/parameters/UserRole'
    get:
      operationId: listFeedVersions
      summary: Feed versions, newest first
      tags: [admin]
      x-access: admin
      x-rate-limit: { perMinute: 60 }
      parameters:
        - name: source
          in: query
          required: false
          description: Only versions of this feed source.
          schema:
            $ref: '#/components/schemas/FeedSourceCode'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FeedStatus'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of feed versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedVersion'
                  nextCursor:
                    $ref: './common.yaml#/components/schemas/Cursor'
                additionalProperties: false
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /admin/feed-versions/{id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: './common.yaml#/components/parameters/UserId'
      - $ref: './common.yaml#/components/parameters/UserRole'
      - $ref: '#/components/parameters/FeedVersionIdPath'
    get:
      operationId: getFeedVersion
      summary: One feed version with its import status and error
      tags: [admin]
      x-access: admin
      x-rate-limit: { perMinute: 60 }
      responses:
        '200':
          description: Feed version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedVersion'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /admin/feed-sources/{code}/import:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: './common.yaml#/components/parameters/UserId'
      - $ref: './common.yaml#/components/parameters/UserRole'
      - name: code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/FeedSourceCode'
    post:
      operationId: importFeed
      summary: Download the feed of a source and import it
      description: |
        Answers at once with a `downloading` feed version; everything else (download, staging,
        promotion, transfers, access stops) runs in the background, however long it takes: poll
        `GET /admin/feed-versions/{id}`. A download that fails, or an archive that was imported before,
        ends as `failed` with the reason in `errorMessage`.
      tags: [admin]
      x-access: admin
      x-rate-limit: { perMinute: 6 }
      responses:
        '202':
          description: The import runs in the background.
          headers:
            Location:
              $ref: './common.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /admin/feed-versions/{id}/activate:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: './common.yaml#/components/parameters/UserId'
      - $ref: './common.yaml#/components/parameters/UserRole'
      - $ref: '#/components/parameters/FeedVersionIdPath'
    post:
      operationId: activateFeedVersion
      summary: Make a validated version the active one of its source
      description: |
        Archives the previously active version, activates this one, refreshes the coverage view
        and publishes `transit.feed.activated.v1`, all in one transaction.
      tags: [admin]
      x-access: admin
      x-rate-limit: { perMinute: 6 }
      responses:
        '200':
          description: The version is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedVersion'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /internal/cities/{code}/active-feed:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/CityCodePath'
    get:
      operationId: getActiveFeed
      summary: Active feed version of a city (used by accessibility at start-up)
      tags: [internal]
      x-access: internal
      responses:
        '200':
          description: Active feed version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveFeed'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /internal/feed-versions/{id}/timetable:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/FeedVersionIdPath'
    get:
      operationId: getTimetable
      summary: Timetable artifact for one service date
      description: |
        Trips whose service runs on `date`, plus trips of the previous day still running after
        midnight (their times minus 86 400). Grouped into non-overtaking patterns. Built once per
        (feed version, date) and cached; sent gzip-compressed with a strong `ETag`.
      tags: [internal]
      x-access: internal
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Timetable artifact.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableArtifact'
        '304':
          description: The artifact matching `If-None-Match` is still current.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '422':
          $ref: './common.yaml#/components/responses/Unprocessable'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /internal/feed-versions/{id}/hex-access:
    parameters:
      - $ref: './common.yaml#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/FeedVersionIdPath'
    get:
      operationId: getHexAccess
      summary: Cells of the city with centroid and access stops
      tags: [internal]
      x-access: internal
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Every grid cell of the feed's city; cells without access stops have an empty list.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HexAccess'
        '304':
          description: Not modified.
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /health/live:
    $ref: './common.yaml#/components/pathItems/HealthLive'
  /health/ready:
    $ref: './common.yaml#/components/pathItems/HealthReady'

components:
  parameters:
    CityCodePath:
      name: code
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/CityCode'
    FeedVersionIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FeedVersionId'

  schemas:
    FeedVersionId:
      type: integer
      minimum: 1
    FeedSourceCode:
      type: string
      pattern: '^[a-z0-9_]+$'
      examples: [waw_ztm]
    FeedStatus:
      type: string
      enum: [downloading, downloaded, staged, validated, active, archived, failed]
    BoundingBox:
      type: object
      description: West, south, east, north in degrees (WGS 84).
      required: [west, south, east, north]
      properties:
        west:
          type: number
        south:
          type: number
        east:
          type: number
        north:
          type: number
      additionalProperties: false
    City:
      type: object
      required: [code, name, countryCode, timezone, h3Resolution, bounds, activeFeed]
      properties:
        code:
          $ref: './common.yaml#/components/schemas/CityCode'
        name:
          type: string
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        timezone:
          type: string
          examples: [Europe/Warsaw]
        h3Resolution:
          type: integer
          minimum: 7
          maximum: 10
        bounds:
          $ref: '#/components/schemas/BoundingBox'
        activeFeed:
          oneOf:
            - $ref: '#/components/schemas/ActiveFeed'
            - type: 'null'
      additionalProperties: false
    ActiveFeed:
      type: object
      required: [feedVersionId, cityCode, validFrom, validTo]
      properties:
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        cityCode:
          $ref: './common.yaml#/components/schemas/CityCode'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
      additionalProperties: false
    CityCoverage:
      type: object
      required: [cityCode, feedVersionId, hexTotal, hexWithStop, stops, routes, trips]
      properties:
        cityCode:
          $ref: './common.yaml#/components/schemas/CityCode'
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        hexTotal:
          type: integer
          minimum: 0
          description: Cells in the city grid.
        hexWithStop:
          type: integer
          minimum: 0
          description: Cells with at least one stop within walking distance.
        stops:
          type: integer
          minimum: 0
        routes:
          type: integer
          minimum: 0
        trips:
          type: integer
          minimum: 0
      additionalProperties: false
    FeedVersion:
      type: object
      required:
        [
          feedVersionId,
          sourceCode,
          cityCode,
          status,
          sha256,
          fetchedAt,
          validFrom,
          validTo,
          activatedAt,
          archivedAt,
          errorMessage,
        ]
      properties:
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        sourceCode:
          $ref: '#/components/schemas/FeedSourceCode'
        cityCode:
          $ref: './common.yaml#/components/schemas/CityCode'
        status:
          $ref: '#/components/schemas/FeedStatus'
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: null until the archive is downloaded.
        fetchedAt:
          type: string
          format: date-time
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        activatedAt:
          type: [string, 'null']
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
        errorMessage:
          type: [string, 'null']
          description: Why the import failed; present exactly when `status` is `failed`.
      additionalProperties: false
    ImportAccepted:
      type: object
      required: [feedVersionId, status, duplicate]
      properties:
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        status:
          $ref: '#/components/schemas/FeedStatus'
        duplicate:
          type: boolean
          description: true = this archive had been imported before (no-op).
      additionalProperties: false
    TimetableArtifact:
      type: object
      description: Format of `docs/05-algorithms.md#4-timetable-artifact-transit-data---accessibility`.
      required: [version, feedVersionId, date, stops, transfers, patterns]
      properties:
        version:
          type: integer
          const: 1
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        date:
          type: string
          format: date
        stops:
          type: array
          description: Stops in id order; `id` is the compact stop id used everywhere else in the artifact.
          items:
            type: object
            required: [id, lat, lon]
            properties:
              id:
                type: integer
                minimum: 1
              lat:
                type: number
              lon:
                type: number
            additionalProperties: false
        transfers:
          type: array
          description: Walking links `[fromStopId, toStopId, walkS]`.
          items:
            type: array
            prefixItems:
              - type: integer
              - type: integer
              - type: integer
                minimum: 1
            minItems: 3
            maxItems: 3
        patterns:
          type: array
          items:
            type: object
            required: [routeId, stops, trips]
            properties:
              routeId:
                type: integer
              stops:
                type: array
                minItems: 2
                items:
                  type: integer
              trips:
                type: array
                description: |
                  One array per trip, `[arr0, dep0, arr1, dep1, ...]` in seconds of the service day
                  (negative for the part of a previous-day trip before midnight). Sorted by the
                  departure at the first stop; trips never overtake each other within a pattern.
                items:
                  type: array
                  items:
                    type: integer
            additionalProperties: false
      additionalProperties: false
    HexAccess:
      type: object
      required: [feedVersionId, cityCode, resolution, cells]
      properties:
        feedVersionId:
          $ref: '#/components/schemas/FeedVersionId'
        cityCode:
          $ref: './common.yaml#/components/schemas/CityCode'
        resolution:
          type: integer
          minimum: 7
          maximum: 10
        cells:
          type: array
          items:
            type: object
            required: [h3, lat, lon, stops]
            properties:
              h3:
                $ref: './common.yaml#/components/schemas/H3Cell'
              lat:
                type: number
              lon:
                type: number
              stops:
                type: array
                description: Access stops `[stopId, walkS]`, nearest first, at most 5.
                maxItems: 5
                items:
                  type: array
                  prefixItems:
                    - type: integer
                    - type: integer
                      minimum: 0
                  minItems: 2
                  maxItems: 2
            additionalProperties: false
      additionalProperties: false
