openapi: 3.1.0
info:
  title: Shared components
  version: 1.0.0
  description: |
    Components shared by the service contracts. Not an API on its own; referenced as
    `./common.yaml#/components/...`.
paths: {}
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Every error response of every service uses it.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem kind, e.g. `/problems/validation`. `about:blank` when only the status matters.
          examples: [/problems/validation]
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence. Never contains SQL, stack traces or personal data.
        instance:
          type: string
          description: Request path that produced the problem.
        correlationId:
          type: string
          description: Same value as the `X-Correlation-Id` response header.
        errors:
          type: array
          description: Field errors of a validation problem.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: JSON pointer of the invalid field, e.g. `/origin/lat`.
              message:
                type: string
      additionalProperties: true
    Coordinates:
      type: object
      description: WGS 84 position.
      required: [lat, lon]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    CityCode:
      type: string
      pattern: '^[a-z]{3}$'
      description: Three-letter city code.
      examples: [waw, vno]
    H3Cell:
      type: string
      pattern: '^8[0-9a-f]{14}$'
      description: H3 cell index, 15 hexadecimal characters.
      examples: [891f53c9a43ffff]
    Uuid:
      type: string
      format: uuid
    Cursor:
      type: [string, 'null']
      maxLength: 200
      description: Opaque cursor of the next page; `null` on the last page.
    HealthLive:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: One entry per dependency (database, broker, upstreams, timetable).
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, unavailable]
              detail:
                type: string

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Request correlation id. The gateway creates one (UUID) when the client sends none and
        forwards it; every service logs it, returns it and passes it on.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Id of the signed-in user. Set by the gateway after verifying the access token; a client value is always stripped.
      schema:
        $ref: '#/components/schemas/Uuid'
    UserIdOptional:
      name: X-User-Id
      in: header
      required: false
      description: Id of the signed-in user, absent for anonymous requests. Set by the gateway only.
      schema:
        $ref: '#/components/schemas/Uuid'
    UserRole:
      name: X-User-Role
      in: header
      required: true
      description: Role of the signed-in user. Set by the gateway only.
      schema:
        type: string
        enum: [user, admin]
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200

  headers:
    CorrelationId:
      description: Correlation id of the request (received or generated).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    Location:
      description: URL of the created or running resource.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails schema validation.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired credentials.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: A business rule prevents the change.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Well-formed input that cannot be accepted.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is down or the service is overloaded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error; details are only in the logs under the correlation id.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthLive:
      description: The process is up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthLive'
    HealthReady:
      description: All dependencies are reachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReady'
    HealthNotReady:
      description: At least one dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReady'

  pathItems:
    HealthLive:
      get:
        operationId: healthLive
        summary: Liveness probe
        tags: [health]
        x-access: internal
        responses:
          '200':
            $ref: '#/components/responses/HealthLive'
    HealthReady:
      get:
        operationId: healthReady
        summary: Readiness probe
        tags: [health]
        x-access: internal
        responses:
          '200':
            $ref: '#/components/responses/HealthReady'
          '503':
            $ref: '#/components/responses/HealthNotReady'
