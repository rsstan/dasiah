# GENERATED by `pnpm contracts:gen` from the service contracts. Do not edit by hand.
openapi: 3.1.0
info:
  title: Transit Accessibility Heatmap public API
  version: 1.0.0
  description: |-
    Public API behind the gateway. GENERATED by `pnpm contracts:gen` from the service contracts in
    `contracts/openapi/`; do not edit by hand.

    Every operation keeps `x-access` (public, user, admin), `x-rate-limit` (requests per minute,
    per user id when signed in, otherwise per client IP) and `x-service` (upstream). The gateway
    sets `X-User-Id` and `X-User-Role` for the upstream after verifying the access token and
    strips any such header sent by a client. Every response carries `X-Correlation-Id`.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Served by identity
  - name: users
    description: Served by identity
  - name: cities
    description: Served by transit-data
  - name: admin
    description: Served by transit-data
  - name: legend
    description: Served by accessibility
  - name: calculations
    description: Served by accessibility
  - name: geocoding
    description: Served by places
  - name: places
    description: Served by places
  - name: history
    description: Served by places
  - name: health
    description: Gateway health
paths:
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: register
      summary: Create an account
      tags:
        - auth
      x-access: public
      x-rate-limit:
        perMinute: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. The user signs in with `/auth/login`.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security: []
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      x-access: public
      x-rate-limit:
        perMinute: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The refresh token is set as a cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security: []
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: refresh
      summary: Exchange the refresh token for a new pair (rotation)
      description: |
        The presented token is revoked and replaced. Presenting a token that was already
        replaced is treated as theft: every session of the user is revoked and `401` is returned.
      tags:
        - auth
      x-access: public
      x-rate-limit:
        perMinute: 30
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: New access token; the new refresh token is set as a cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security: []
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: logout
      summary: Revoke the current refresh token
      tags:
        - auth
      x-access: user
      x-rate-limit:
        perMinute: 30
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security:
        - bearerAuth: []
  /users/me:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getMe
      summary: Profile of the signed-in user
      tags:
        - users
      x-access: user
      x-rate-limit:
        perMinute: 60
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security:
        - bearerAuth: []
    delete:
      operationId: deleteMe
      summary: Erase the account
      description: |
        Anonymises the account (`identity.anonymize_user`), ends every session and publishes
        `identity.user.deleted.v1`, after which `places` erases the user's places and history.
      tags:
        - users
      x-access: user
      x-rate-limit:
        perMinute: 5
      responses:
        "204":
          description: Account erased; the refresh cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security:
        - bearerAuth: []
    patch:
      operationId: updateMe
      summary: Change display name or locale
      tags:
        - users
      x-access: user
      x-rate-limit:
        perMinute: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security:
        - bearerAuth: []
  /users/me/password:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: changePassword
      summary: Change the password and end every other session
      description: |
        The refresh-token cookie is scoped to `/api/v1/auth`, so this request cannot tell which
        session is the current one. Every refresh token of the user is revoked and a new pair is
        issued in the response: the user stays signed in on this device only.
      tags:
        - users
      x-access: user
      x-rate-limit:
        perMinute: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; all previous sessions ended, a new one started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password does not match.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: identity
      security:
        - bearerAuth: []
  /cities:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listCities
      summary: Supported cities with bounds and the validity of the active timetable
      tags:
        - cities
      x-access: public
      x-rate-limit:
        perMinute: 120
      responses:
        "200":
          description: Enabled cities, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
                additionalProperties: false
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security: []
  /cities/{code}/coverage:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/CityCodePath"
    get:
      operationId: getCityCoverage
      summary: Grid and network size of the active feed (transit.mv_city_coverage)
      tags:
        - cities
      x-access: public
      x-rate-limit:
        perMinute: 60
      responses:
        "200":
          description: Coverage numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityCoverage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security: []
  /admin/feed-versions:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listFeedVersions
      summary: Feed versions, newest first
      tags:
        - admin
      x-access: admin
      x-rate-limit:
        perMinute: 60
      parameters:
        - name: source
          in: query
          required: false
          description: Only versions of this feed source.
          schema:
            $ref: "#/components/schemas/FeedSourceCode"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FeedStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of feed versions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedVersion"
                  nextCursor:
                    $ref: "#/components/schemas/Cursor"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security:
        - bearerAuth: []
  /admin/feed-versions/{id}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/FeedVersionIdPath"
    get:
      operationId: getFeedVersion
      summary: One feed version with its import status and error
      tags:
        - admin
      x-access: admin
      x-rate-limit:
        perMinute: 60
      responses:
        "200":
          description: Feed version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security:
        - bearerAuth: []
  /admin/feed-sources/{code}/import:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - name: code
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/FeedSourceCode"
    post:
      operationId: importFeed
      summary: Download the feed of a source and import it
      description: |
        Downloads the archive and computes its SHA-256 before answering. A new archive gets a
        `downloaded` feed version and the rest of the pipeline (staging, promotion, transfers,
        access stops) continues in the background: poll `GET /admin/feed-versions/{id}`.
        An archive that was already imported is a no-op answered with `200`.
      tags:
        - admin
      x-access: admin
      x-rate-limit:
        perMinute: 6
      responses:
        "200":
          description: The same archive was imported before; nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "202":
          description: New archive stored; the import runs in the background.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The publisher could not be reached or returned an error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security:
        - bearerAuth: []
  /admin/feed-versions/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/FeedVersionIdPath"
    post:
      operationId: activateFeedVersion
      summary: Make a validated version the active one of its source
      description: |
        Archives the previously active version, activates this one, refreshes the coverage view
        and publishes `transit.feed.activated.v1`, all in one transaction.
      tags:
        - admin
      x-access: admin
      x-rate-limit:
        perMinute: 6
      responses:
        "200":
          description: The version is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: transit-data
      security:
        - bearerAuth: []
  /legend:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getLegend
      summary: Legend classes of the map, best first
      tags:
        - legend
      x-access: public
      x-rate-limit:
        perMinute: 120
      responses:
        "200":
          description: Rows of `accessibility.ratio_classes`.
          headers:
            Cache-Control:
              schema:
                type: string
                examples:
                  - public
                  - max-age=3600
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegendClass"
                additionalProperties: false
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: accessibility
      security: []
  /calculations:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: createCalculation
      summary: Request an accessibility map for an origin
      description: |
        Snaps the origin to its H3 resolution-10 cell and looks up the cache. A cached map is
        returned with `200`; otherwise the map is computed now (`201`). If the same question is
        being computed by another request, `202` points to it. Signed-in requests are added to
        the user's history through `accessibility.calculation.completed.v1`.
      tags:
        - calculations
      x-access: public
      x-rate-limit:
        perMinute: 20
        anonymousPerMinute: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
      responses:
        "200":
          description: Cache hit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "201":
          description: Computed now.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "202":
          description: The same question is being computed; poll `GET /calculations/{id}`.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: accessibility
      security:
        - {}
        - bearerAuth: []
  /calculations/{id}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/CalculationIdPath"
    get:
      operationId: getCalculation
      summary: Status and metadata of a calculation
      tags:
        - calculations
      x-access: public
      x-rate-limit:
        perMinute: 120
      responses:
        "200":
          description: Calculation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: accessibility
      security: []
  /calculations/{id}/results:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/CalculationIdPath"
    get:
      operationId: getCalculationResults
      summary: Per-cell travel times, ratio and legend class
      description: A finished calculation never changes, so the response is cacheable forever (until it expires and is removed).
      tags:
        - calculations
      x-access: public
      x-rate-limit:
        perMinute: 60
      responses:
        "200":
          description: Results; sent gzip-compressed.
          headers:
            Cache-Control:
              schema:
                type: string
                examples:
                  - public
                  - max-age=86400
                  - immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The calculation is still running or has failed; see `GET /calculations/{id}`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: accessibility
      security: []
  /geocode:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: geocode
      summary: Address candidates inside a city
      description: |
        Answers from the cache when possible; otherwise asks the geocoder (throttled) and caches
        the result. If the geocoder is unavailable, only cached answers are returned.
      tags:
        - geocoding
      x-access: public
      x-rate-limit:
        perMinute: 30
      parameters:
        - name: city
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CityCode"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 200
      responses:
        "200":
          description: Up to 5 candidates, best first. Empty when nothing was found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items:
                      $ref: "#/components/schemas/GeocodeCandidate"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security: []
  /places:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listPlaces
      summary: Saved places of the signed-in user (at most 20)
      tags:
        - places
      x-access: user
      x-rate-limit:
        perMinute: 60
      responses:
        "200":
          description: All saved places, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/SavedPlace"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security:
        - bearerAuth: []
    post:
      operationId: createPlace
      summary: Save a place
      tags:
        - places
      x-access: user
      x-rate-limit:
        perMinute: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaceRequest"
      responses:
        "201":
          description: Saved.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The user already has 20 places (`/problems/place-limit`) or a place with this label (`/problems/duplicate-label`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security:
        - bearerAuth: []
  /places/{id}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    delete:
      operationId: deletePlace
      summary: Delete a saved place (owner only)
      tags:
        - places
      x-access: user
      x-rate-limit:
        perMinute: 20
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security:
        - bearerAuth: []
    patch:
      operationId: updatePlace
      summary: Change a saved place (owner only)
      tags:
        - places
      x-access: user
      x-rate-limit:
        perMinute: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaceRequest"
      responses:
        "200":
          description: Updated place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security:
        - bearerAuth: []
  /history:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listHistory
      summary: Maps the signed-in user asked for, newest first (latest 50 are kept)
      tags:
        - history
      x-access: user
      x-rate-limit:
        perMinute: 60
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of history.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  nextCursor:
                    $ref: "#/components/schemas/Cursor"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-service: places
      security:
        - bearerAuth: []
  /health/live:
    servers:
      - url: /
    get:
      operationId: gatewayHealthLive
      summary: Gateway liveness
      tags:
        - health
      x-access: public
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthLive"
  /health/ready:
    servers:
      - url: /
    get:
      operationId: gatewayHealthReady
      summary: Aggregated readiness of the gateway and every service
      tags:
        - health
      x-access: public
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthReady"
        "503":
          $ref: "#/components/responses/HealthNotReady"
components:
  headers:
    ClearRefreshCookie:
      description: "`refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0`"
      schema:
        type: string
    CorrelationId:
      description: Correlation id of the request (received or generated).
      schema:
        type: string
    Location:
      description: URL of the created or running resource.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    SetRefreshCookie:
      description: "`refresh_token=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<REFRESH_TTL_S>`"
      schema:
        type: string
  parameters:
    CalculationIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CityCodePath:
      name: code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CityCode"
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Request correlation id. The gateway creates one (UUID) when the client sends none and
        forwards it; every service logs it, returns it and passes it on.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    FeedVersionIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedVersionId"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: true
      description: Opaque refresh token set by `/auth/login` or `/auth/refresh`.
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    BadRequest:
      description: The request is malformed or fails schema validation.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A business rule prevents the change.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    HealthLive:
      description: The process is up.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthLive"
    HealthNotReady:
      description: At least one dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReady"
    HealthReady:
      description: All dependencies are reachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReady"
    InternalError:
      description: Unexpected error; details are only in the logs under the correlation id.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency is down or the service is overloaded.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid or expired credentials.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Well-formed input that cannot be accepted.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ActiveFeed:
      type: object
      required:
        - feedVersionId
        - cityCode
        - validFrom
        - validTo
      properties:
        feedVersionId:
          $ref: "#/components/schemas/FeedVersionId"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
      additionalProperties: false
    AddressText:
      type: string
      minLength: 3
      maxLength: 300
    BoundingBox:
      type: object
      description: West, south, east, north in degrees (WGS 84).
      required:
        - west
        - south
        - east
        - north
      properties:
        west:
          type: number
        south:
          type: number
        east:
          type: number
        north:
          type: number
      additionalProperties: false
    Calculation:
      type: object
      required:
        - calculationId
        - status
        - cityCode
        - originH3
        - feedVersionId
        - date
        - time
        - windowMinutes
        - cellCount
        - durationMs
        - createdAt
        - expiresAt
        - errorCode
      properties:
        calculationId:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - running
            - done
            - failed
        cityCode:
          $ref: "#/components/schemas/CityCode"
        originH3:
          $ref: "#/components/schemas/H3Cell"
        feedVersionId:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        time:
          $ref: "#/components/schemas/LocalTime"
        windowMinutes:
          type: integer
          minimum: 0
        cellCount:
          type:
            - integer
            - "null"
          minimum: 0
          description: Number of result cells; null while running or after a failure.
        durationMs:
          type:
            - integer
            - "null"
          minimum: 0
          description: Computation time; null while running.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        errorCode:
          type:
            - string
            - "null"
          description: Set when `status` is `failed`, e.g. `osrm_unavailable`.
      additionalProperties: false
    CalculationRequest:
      type: object
      required:
        - cityCode
        - origin
      properties:
        cityCode:
          $ref: "#/components/schemas/CityCode"
        origin:
          $ref: "#/components/schemas/Coordinates"
        date:
          type: string
          format: date
          description: Service date. Default - the next working day inside the feed validity.
        time:
          $ref: "#/components/schemas/LocalTime"
        windowMinutes:
          type: integer
          minimum: 0
          maximum: 120
          multipleOf: 5
          default: 0
          description: 0 = single departure; otherwise departures every 5 minutes in the window, median per cell.
      additionalProperties: false
    CalculationResults:
      type: object
      required:
        - calculationId
        - resolution
        - cells
      properties:
        calculationId:
          $ref: "#/components/schemas/Uuid"
        resolution:
          type: integer
          minimum: 7
          maximum: 10
          description: H3 resolution of the cells.
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellResult"
      additionalProperties: false
    CellResult:
      type: object
      required:
        - h3
        - transitS
        - carS
        - ratio
        - class
      properties:
        h3:
          $ref: "#/components/schemas/H3Cell"
        transitS:
          type:
            - integer
            - "null"
          minimum: 0
          description: Door-to-door seconds by public transport or on foot; null = not reachable.
        carS:
          type:
            - integer
            - "null"
          minimum: 1
          description: Driving seconds; null = no road route.
        ratio:
          type:
            - number
            - "null"
          description: transitS / carS rounded to 2 decimals; null when either is null.
        class:
          $ref: "#/components/schemas/LegendClassCode"
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          $ref: "#/components/schemas/Password"
      additionalProperties: false
    City:
      type: object
      required:
        - code
        - name
        - countryCode
        - timezone
        - h3Resolution
        - bounds
        - activeFeed
      properties:
        code:
          $ref: "#/components/schemas/CityCode"
        name:
          type: string
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        timezone:
          type: string
          examples:
            - Europe/Warsaw
        h3Resolution:
          type: integer
          minimum: 7
          maximum: 10
        bounds:
          $ref: "#/components/schemas/BoundingBox"
        activeFeed:
          oneOf:
            - $ref: "#/components/schemas/ActiveFeed"
            - type: "null"
      additionalProperties: false
    CityCode:
      type: string
      pattern: ^[a-z]{3}$
      description: Three-letter city code.
      examples:
        - waw
        - vno
    CityCoverage:
      type: object
      required:
        - cityCode
        - feedVersionId
        - hexTotal
        - hexWithStop
        - stops
        - routes
        - trips
      properties:
        cityCode:
          $ref: "#/components/schemas/CityCode"
        feedVersionId:
          $ref: "#/components/schemas/FeedVersionId"
        hexTotal:
          type: integer
          minimum: 0
          description: Cells in the city grid.
        hexWithStop:
          type: integer
          minimum: 0
          description: Cells with at least one stop within walking distance.
        stops:
          type: integer
          minimum: 0
        routes:
          type: integer
          minimum: 0
        trips:
          type: integer
          minimum: 0
      additionalProperties: false
    Coordinates:
      type: object
      description: WGS 84 position.
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    CreatePlaceRequest:
      type: object
      required:
        - kind
        - label
        - addressText
        - cityCode
        - location
      properties:
        kind:
          $ref: "#/components/schemas/PlaceKind"
        label:
          $ref: "#/components/schemas/PlaceLabel"
        addressText:
          $ref: "#/components/schemas/AddressText"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        location:
          $ref: "#/components/schemas/Coordinates"
      additionalProperties: false
    Cursor:
      type:
        - string
        - "null"
      maxLength: 200
      description: Opaque cursor of the next page; `null` on the last page.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    Email:
      type: string
      format: email
      maxLength: 254
      description: Case-insensitive; stored once per account.
    FeedSourceCode:
      type: string
      pattern: ^[a-z0-9_]+$
      examples:
        - waw_ztm
    FeedStatus:
      type: string
      enum:
        - downloaded
        - staged
        - validated
        - active
        - archived
        - failed
    FeedVersion:
      type: object
      required:
        - feedVersionId
        - sourceCode
        - cityCode
        - status
        - sha256
        - fetchedAt
        - validFrom
        - validTo
        - activatedAt
        - archivedAt
        - errorMessage
      properties:
        feedVersionId:
          $ref: "#/components/schemas/FeedVersionId"
        sourceCode:
          $ref: "#/components/schemas/FeedSourceCode"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        status:
          $ref: "#/components/schemas/FeedStatus"
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        fetchedAt:
          type: string
          format: date-time
        validFrom:
          type:
            - string
            - "null"
          format: date
        validTo:
          type:
            - string
            - "null"
          format: date
        activatedAt:
          type:
            - string
            - "null"
          format: date-time
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        errorMessage:
          type:
            - string
            - "null"
          description: Why the import failed; present exactly when `status` is `failed`.
      additionalProperties: false
    FeedVersionId:
      type: integer
      minimum: 1
    GeocodeCandidate:
      type: object
      required:
        - displayName
        - lat
        - lon
      properties:
        displayName:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    H3Cell:
      type: string
      pattern: ^8[0-9a-f]{14}$
      description: H3 cell index, 15 hexadecimal characters.
      examples:
        - 891f53c9a43ffff
    HealthLive:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    HealthReady:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          description: One entry per dependency (database, broker, upstreams, timetable).
          additionalProperties:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - ok
                  - unavailable
              detail:
                type: string
    HistoryEntry:
      type: object
      required:
        - calculationId
        - cityCode
        - originH3
        - createdAt
      properties:
        calculationId:
          $ref: "#/components/schemas/Uuid"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        originH3:
          $ref: "#/components/schemas/H3Cell"
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    ImportAccepted:
      type: object
      required:
        - feedVersionId
        - status
        - duplicate
      properties:
        feedVersionId:
          $ref: "#/components/schemas/FeedVersionId"
        status:
          $ref: "#/components/schemas/FeedStatus"
        duplicate:
          type: boolean
          description: true = this archive had been imported before (no-op).
      additionalProperties: false
    LegendClass:
      type: object
      required:
        - code
        - label
        - minRatio
        - maxRatio
        - color
        - sortOrder
      properties:
        code:
          $ref: "#/components/schemas/LegendClassCode"
        label:
          type: string
        minRatio:
          type:
            - number
            - "null"
          description: Inclusive lower bound of t_transit / t_car; null for the special classes.
        maxRatio:
          type:
            - number
            - "null"
          description: Exclusive upper bound; null = unbounded or special class.
        color:
          type: string
          pattern: ^#[0-9a-f]{6}$
        sortOrder:
          type: integer
      additionalProperties: false
    LegendClassCode:
      type: string
      enum:
        - excellent
        - good
        - fair
        - poor
        - very_poor
        - unreachable
        - no_transit
    Locale:
      type: string
      enum:
        - en
        - pl
        - lt
        - ru
    LocalTime:
      type: string
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: Local time of day in the city's time zone, HH:MM.
      examples:
        - 08:00
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: Plain password in the request only; hashed with Argon2id, never stored or logged.
    PlaceKind:
      type: string
      enum:
        - home
        - work
        - study
        - other
    PlaceLabel:
      type: string
      minLength: 1
      maxLength: 60
    Problem:
      type: object
      description: RFC 9457 problem details. Every error response of every service uses it.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem kind, e.g. `/problems/validation`. `about:blank` when only the status matters.
          examples:
            - /problems/validation
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence. Never contains SQL, stack traces or personal data.
        instance:
          type: string
          description: Request path that produced the problem.
        correlationId:
          type: string
          description: Same value as the `X-Correlation-Id` response header.
        errors:
          type: array
          description: Field errors of a validation problem.
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                description: JSON pointer of the invalid field, e.g. `/origin/lat`.
              message:
                type: string
      additionalProperties: true
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        displayName:
          $ref: "#/components/schemas/DisplayName"
        locale:
          $ref: "#/components/schemas/Locale"
      additionalProperties: false
    SavedPlace:
      type: object
      required:
        - placeId
        - kind
        - label
        - addressText
        - cityCode
        - location
        - createdAt
        - updatedAt
      properties:
        placeId:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/PlaceKind"
        label:
          $ref: "#/components/schemas/PlaceLabel"
        addressText:
          $ref: "#/components/schemas/AddressText"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        location:
          $ref: "#/components/schemas/Coordinates"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: "JWT for the `Authorization: Bearer` header."
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime of the access token in seconds.
      additionalProperties: false
    UpdatePlaceRequest:
      type: object
      minProperties: 1
      properties:
        kind:
          $ref: "#/components/schemas/PlaceKind"
        label:
          $ref: "#/components/schemas/PlaceLabel"
        addressText:
          $ref: "#/components/schemas/AddressText"
        cityCode:
          $ref: "#/components/schemas/CityCode"
        location:
          $ref: "#/components/schemas/Coordinates"
      additionalProperties: false
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          oneOf:
            - $ref: "#/components/schemas/DisplayName"
            - type: "null"
        locale:
          $ref: "#/components/schemas/Locale"
      additionalProperties: false
    UserProfile:
      type: object
      required:
        - userId
        - email
        - displayName
        - role
        - locale
        - createdAt
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        email:
          $ref: "#/components/schemas/Email"
        displayName:
          oneOf:
            - $ref: "#/components/schemas/DisplayName"
            - type: "null"
        role:
          type: string
          enum:
            - user
            - admin
        locale:
          $ref: "#/components/schemas/Locale"
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/login` or `POST /auth/refresh`.
